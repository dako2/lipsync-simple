<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TTS Lip Sync with Flubber (Fixed Loader)</title>
<style>
  :root { --bg:#0b1020; --card:#111831; --fg:#dfe7ff; --accent:#7aa2ff; }
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial}
  header{padding:16px 20px;border-bottom:1px solid #1f2a4a}
  h1{margin:0;font-size:18px}
  .wrap{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px}
  .panel{background:var(--card);border:1px solid #1f2a4a;border-radius:14px;padding:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button,select,textarea,input[type=range]{background:#182243;border:1px solid #26325c;color:var(--fg);padding:8px 10px;border-radius:10px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  textarea{width:100%;min-height:120px;font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .face-wrap{display:flex;align-items:center;justify-content:center;height:460px}
  .viseme{display:inline-block;min-width:2ch;text-align:center;font-weight:700;color:var(--accent)}
  .progress{height:6px;background:#0f1531;border-radius:6px;overflow:hidden;margin-top:10px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#b387ff)}
  .label{opacity:.8;font-size:12px}
  small{opacity:.8}
</style>
</head>
<body>
<header><h1>Browser TTS Lip Sync + Flubber (Robust)</h1></header>

<div class="wrap">
  <section class="panel">
    <div class="label">Enter text, pick a system voice, then click Speak. Uses <code>flubber</code> for smooth morphing (with CDN fallback).</div>
    <textarea id="text">Hello there! This demo morphs SVG mouth shapes with flubber while the browser TTS speaks the text.</textarea>
    <div class="row" style="margin-top:8px">
      <label>Voice: <select id="voiceSel"></select></label>
      <label>Rate: <input id="rate" type="range" min="0.5" max="1.5" step="0.05" value="1.0"></label>
      <label>Pitch: <input id="pitch" type="range" min="0" max="2" step="0.1" value="1.0"></label>
      <label>Volume: <input id="vol" type="range" min="0" max="1" step="0.05" value="1.0"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="speak">▶︎ Speak</button>
      <button id="stop" disabled>⏹ Stop</button>
    </div>
    <div style="margin-top:12px">
      <div>Current viseme: <span id="v" class="viseme">X</span></div>
      <div>t=<span id="t">0.000</span>s · char <span id="i">0</span>/<span id="L">0</span></div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <small id="status" style="display:block;margin-top:8px;opacity:.8"></small>
    </div>
  </section>

  <section class="panel face-wrap">
    <svg id="face" viewBox="0 0 300 360" width="340" height="440" aria-label="avatar">
      <defs>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge> 
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="eyebrowGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
          <feMerge> 
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <radialGradient id="faceGradient" cx="0.4" cy="0.25" r="0.9">
          <stop offset="0%" stop-color="#fff5e6"/>
          <stop offset="40%" stop-color="#ffecd1"/>
          <stop offset="70%" stop-color="#f4decf"/>
          <stop offset="100%" stop-color="#e8c5a0"/>
        </radialGradient>
        <radialGradient id="eyeGradient" cx="0.3" cy="0.3" r="0.7">
          <stop offset="0%" stop-color="#6bb6ff"/>
          <stop offset="30%" stop-color="#4a90e2"/>
          <stop offset="70%" stop-color="#2c5aa0"/>
          <stop offset="100%" stop-color="#1a365d"/>
        </radialGradient>
        <linearGradient id="eyebrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6b4423"/>
          <stop offset="50%" stop-color="#8b4513"/>
          <stop offset="100%" stop-color="#6b4423"/>
        </linearGradient>
        <radialGradient id="cheekBlush" cx="0.5" cy="0.5" r="0.8">
          <stop offset="0%" stop-color="#ffb3ba" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#ffb3ba" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="lipGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e74c3c"/>
          <stop offset="50%" stop-color="#c0392b"/>
          <stop offset="100%" stop-color="#a93226"/>
        </linearGradient>
      </defs>
      
      <!-- Face with enhanced gradient and subtle contour -->
      <circle cx="150" cy="170" r="120" fill="url(#faceGradient)" filter="url(#shadow)"/>
      
      <!-- Facial contour shading -->
      <path d="M 50 120 Q 80 100 120 110 Q 150 115 180 110 Q 220 100 250 120 Q 270 150 270 180 Q 270 220 250 250 Q 220 280 180 285 Q 150 290 120 285 Q 80 280 50 250 Q 30 220 30 180 Q 30 150 50 120" 
            fill="none" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
      
      <!-- Enhanced cheek highlights with blush -->
      <ellipse cx="105" cy="185" rx="18" ry="10" fill="url(#cheekBlush)"/>
      <ellipse cx="195" cy="185" rx="18" ry="10" fill="url(#cheekBlush)"/>
      <ellipse cx="108" cy="182" rx="12" ry="6" fill="#fff5e6" opacity="0.7"/>
      <ellipse cx="192" cy="182" rx="12" ry="6" fill="#fff5e6" opacity="0.7"/>
      
      <!-- Enhanced eyebrows with gradient and texture -->
      <path d="M 82 118 Q 90 114 100 115 Q 115 116 130 118 Q 135 119 138 121" 
            stroke="url(#eyebrowGradient)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#eyebrowGlow)"/>
      <path d="M 162 121 Q 165 119 170 118 Q 185 116 200 115 Q 210 114 218 118" 
            stroke="url(#eyebrowGradient)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#eyebrowGlow)"/>
      
      <!-- Eye socket subtle shading -->
      <ellipse cx="110" cy="138" rx="22" ry="16" fill="#f0d5b7" opacity="0.4"/>
      <ellipse cx="190" cy="138" rx="22" ry="16" fill="#f0d5b7" opacity="0.4"/>
      
      <!-- Enhanced eye whites with subtle shadow -->
      <ellipse cx="110" cy="140" rx="18" ry="12" fill="#ffffff"/>
      <ellipse cx="190" cy="140" rx="18" ry="12" fill="#ffffff"/>
      <ellipse cx="110" cy="142" rx="16" ry="10" fill="#f8f8f8" opacity="0.6"/>
      <ellipse cx="190" cy="142" rx="16" ry="10" fill="#f8f8f8" opacity="0.6"/>
      
      <!-- Enhanced iris with more detail -->
      <circle cx="110" cy="140" r="10" fill="url(#eyeGradient)"/>
      <circle cx="190" cy="140" r="10" fill="url(#eyeGradient)"/>
      <circle cx="110" cy="140" r="8" fill="#4a90e2" opacity="0.7"/>
      <circle cx="190" cy="140" r="8" fill="#4a90e2" opacity="0.7"/>
      
      <!-- Pupils with depth -->
      <circle cx="110" cy="140" r="4" fill="#000"/>
      <circle cx="190" cy="140" r="4" fill="#000"/>
      <circle cx="110" cy="140" r="2" fill="#1a1a1a" opacity="0.8"/>
      <circle cx="190" cy="140" r="2" fill="#1a1a1a" opacity="0.8"/>
      
      <!-- Enhanced eye highlights -->
      <circle cx="112" cy="137" r="2.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="192" cy="137" r="2.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="108" cy="141" r="1" fill="#ffffff" opacity="0.6"/>
      <circle cx="188" cy="141" r="1" fill="#ffffff" opacity="0.6"/>
      
      <!-- Beautiful eyelashes -->
      <g stroke="#2c1810" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
        <!-- Upper lashes left eye -->
        <path d="M 95 132 Q 96 128 97 130"/>
        <path d="M 100 130 Q 101 126 102 128"/>
        <path d="M 105 129 Q 106 125 107 127"/>
        <path d="M 110 128 Q 111 124 112 126"/>
        <path d="M 115 129 Q 116 125 117 127"/>
        <path d="M 120 130 Q 121 126 122 128"/>
        <path d="M 125 132 Q 126 128 127 130"/>
        <!-- Upper lashes right eye -->
        <path d="M 175 132 Q 176 128 177 130"/>
        <path d="M 180 130 Q 181 126 182 128"/>
        <path d="M 185 129 Q 186 125 187 127"/>
        <path d="M 190 128 Q 191 124 192 126"/>
        <path d="M 195 129 Q 196 125 197 127"/>
        <path d="M 200 130 Q 201 126 202 128"/>
        <path d="M 205 132 Q 206 128 207 130"/>
      </g>
      
      <!-- Enhanced nose with better shading -->
      <path d="M 145 155 Q 150 165 155 155" stroke="#d4a574" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 148 160 Q 150 162 152 160" stroke="#c9956f" stroke-width="1" fill="none" opacity="0.5"/>
      <ellipse cx="147" cy="162" rx="2" ry="1.5" fill="#d4a574" opacity="0.6"/>
      <ellipse cx="153" cy="162" rx="2" ry="1.5" fill="#d4a574" opacity="0.6"/>
      <ellipse cx="150" cy="158" rx="3" ry="1" fill="#e8c5a0" opacity="0.4"/>
      
      <!-- Mouth area with enhanced shadow and highlight -->
      <ellipse cx="150" cy="220" rx="28" ry="18" fill="#e8c5a0" opacity="0.3"/>
      <ellipse cx="150" cy="218" rx="22" ry="12" fill="#f4decf" opacity="0.4"/>
      
      <g id="mouthG" transform="translate(150,220)">
        <path id="mouthPath" fill="url(#lipGradient)" stroke="#8b2635" stroke-width="1" d="" filter="url(#softGlow)" />
      </g>
      
      <!-- Subtle facial highlights for dimension -->
      <ellipse cx="150" cy="145" rx="8" ry="4" fill="#fff5e6" opacity="0.5"/>
      <ellipse cx="150" cy="200" rx="6" ry="3" fill="#fff5e6" opacity="0.4"/>
    </svg>
  </section>
</div>

<script>
// Robust flubber loader: try jsdelivr, then unpkg, then fallback to no-op.
const statusEl = document.getElementById('status');
function logStatus(msg){ statusEl.textContent = msg || ''; }
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function ensureFlubber(){
  if (window.flubber && window.flubber.interpolate) return 'global';
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/flubber@0.4.2/dist/flubber.min.js');
    if (window.flubber && window.flubber.interpolate) return 'jsdelivr';
  } catch (e) {}
  try {
    await loadScript('https://unpkg.com/flubber@0.4.2/dist/flubber.min.js');
    if (window.flubber && window.flubber.interpolate) return 'unpkg';
  } catch (e) {}
  // Fallback (no-op morph: snap to end)
  window.flubber = {
    interpolate: (a,b) => {
      return (t) => (t < 1 ? a : b);
    }
  };
  return 'fallback';
}
</script>

<script>
(async () => {
  const source = await ensureFlubber();
  logStatus(source === 'fallback'
    ? 'Flubber CDN failed; using no-op fallback (shapes will snap). If behind a firewall, download flubber locally and reference it.'
    : `Flubber loaded from ${source}.`);

  // --- SVG path helpers ---
  function roundedRectPath(w, h, r){
    w = Math.max(1, w); h = Math.max(1, h);
    r = Math.min(r, w/2, h/2);
    const x = -w/2, y = -h/2;
    return [
      `M ${x+r} ${y}`,
      `H ${x+w-r}`,
      `Q ${x+w} ${y} ${x+w} ${y+r}`,
      `V ${y+h-r}`,
      `Q ${x+w} ${y+h} ${x+w-r} ${y+h}`,
      `H ${x+r}`,
      `Q ${x} ${y+h} ${x} ${y+h-r}`,
      `V ${y+r}`,
      `Q ${x} ${y} ${x+r} ${y}`,
      `Z`
    ].join(' ');
  }
  function ellipsePath(rx, ry){
    rx = Math.max(1, rx); ry = Math.max(1, ry);
    return `M ${-rx} 0 a ${rx} ${ry} 0 1 0 ${2*rx} 0 a ${rx} ${ry} 0 1 0 ${-2*rx} 0 Z`;
  }

  const visemePaths = {
    X: "M -36 -2 Q -36 -4 -34 -4 L 34 -4 Q 36 -4 36 -2 L 36 2 Q 36 4 34 4 L -34 4 Q -36 4 -36 2 Z",
    A: "M -28 -18 Q -32 -22 -28 -26 Q -20 -30 0 -30 Q 20 -30 28 -26 Q 32 -22 28 -18 Q 24 -12 20 -8 Q 12 0 0 0 Q -12 0 -20 -8 Q -24 -12 -28 -18 Z",
    O: "M -24 -16 Q -28 -20 -24 -24 Q -16 -28 0 -28 Q 16 -28 24 -24 Q 28 -20 24 -16 Q 20 -10 16 -6 Q 8 2 0 2 Q -8 2 -16 -6 Q -20 -10 -24 -16 Z",
    C: "M -32 -8 Q -34 -10 -32 -12 L 32 -12 Q 34 -10 32 -8 L 32 8 Q 34 10 32 12 L -32 12 Q -34 10 -32 8 Z",
    G: "M -20 -10 Q -22 -12 -20 -14 L 20 -14 Q 22 -12 20 -10 L 20 10 Q 22 12 20 14 L -20 14 Q -22 12 -20 10 Z",
    L: "M -30 -6 Q -32 -8 -30 -10 L 30 -10 Q 32 -8 30 -6 L 30 6 Q 32 8 30 10 L -30 10 Q -32 8 -30 6 Z",
    B: "M -2 -2 L 2 -2 L 2 2 L -2 2 Z",
    F: "M -26 -8 Q -28 -10 -26 -12 L 26 -12 Q 28 -10 26 -8 L 26 -2 Q 28 0 26 2 L -26 2 Q -28 0 -26 -2 Z",
    E: "M -30 -6 Q -32 -8 -30 -10 L 30 -10 Q 32 -8 30 -6 L 30 6 Q 32 8 30 10 L -30 10 Q -32 8 -30 6 Z",
    T: "M -24 -8 Q -26 -10 -24 -12 L 24 -12 Q 26 -10 24 -8 L 24 8 Q 26 10 24 12 L -24 12 Q -26 10 -24 8 Z",
    S: "M -22 -6 Q -24 -8 -22 -10 L 22 -10 Q 24 -8 22 -6 L 22 6 Q 24 8 22 10 L -22 10 Q -24 8 -22 6 Z",
    U: "M -20 -14 Q -24 -18 -20 -22 Q -12 -26 0 -26 Q 12 -26 20 -22 Q 24 -18 20 -14 Q 16 -8 12 -4 Q 4 4 0 4 Q -4 4 -12 -4 Q -16 -8 -20 -14 Z",
    Q: "M -18 -12 Q -22 -16 -18 -20 Q -10 -24 0 -24 Q 10 -24 18 -20 Q 22 -16 18 -12 Q 14 -6 10 -2 Q 2 6 0 6 Q -2 6 -10 -2 Q -14 -6 -18 -12 Z"
  };

  const mouthPathEl = document.getElementById('mouthPath');
  let currentViseme = 'X';
  let currentPath = visemePaths[currentViseme];
  mouthPathEl.setAttribute('d', currentPath);

  let animToken = 0;
  function morphToViseme(v, durMs = 140){
    const next = visemePaths[v] || visemePaths['X'];
    if (next === currentPath) return;
    const token = ++animToken;
    const interp = window.flubber.interpolate(currentPath, next, {maxSegmentLength: 3});
    const t0 = performance.now();
    function step(){
      if (token !== animToken) return;
      const t = performance.now();
      const u = Math.min(1, (t - t0) / durMs);
      const eased = u < 0.5 ? 2*u*u : -1 + (4 - 2*u) * u;
      mouthPathEl.setAttribute('d', interp(eased));
      if (u < 1) requestAnimationFrame(step);
      else currentPath = next;
    }
    requestAnimationFrame(step);
    currentViseme = v;
    vEl.textContent = v;
  }

  // --- UI elements ---
  const txt = document.getElementById('text');
  const speakBtn = document.getElementById('speak');
  const stopBtn = document.getElementById('stop');
  const voiceSel = document.getElementById('voiceSel');
  const rateEl = document.getElementById('rate');
  const pitchEl = document.getElementById('pitch');
  const volEl = document.getElementById('vol');

  const vEl = document.getElementById('v');
  const tEl = document.getElementById('t');
  const iEl = document.getElementById('i');
  const LEl = document.getElementById('L');
  const barEl = document.getElementById('bar');

  // Load voices
  let voices = [];
  function loadVoices(){
    voices = window.speechSynthesis.getVoices();
    voiceSel.innerHTML = '';
    voices.forEach((v,i)=>{
      const opt = document.createElement('option');
      opt.value=i;
      opt.textContent=`${v.name} (${v.lang})${v.default?' — default':''}`;
      voiceSel.appendChild(opt);
    });
  }
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;

  // Letter → viseme heuristic
  const char2vis = (ch) => {
    ch = ch.toLowerCase();
    if ("aei".includes(ch)) return "A";
    if ("o".includes(ch)) return "O";
    if ("cdnstxyz".includes(ch)) return "C";
    if ("gk".includes(ch)) return "G";
    if ("l".includes(ch)) return "L";
    if ("bmp".includes(ch)) return "B";
    if ("fv".includes(ch)) return "F";
    if ("u".includes(ch)) return "U";
    if ("qw".includes(ch)) return "Q";
    if ("th".includes(ch)) return "T";
    if ("sh".includes(ch) || "ch".includes(ch) || "j".includes(ch)) return "S";
    if (ch === " ") return "X";
    return "X";
  };

  let speaking=false, startMs=0, lastBoundaryMs=0, charIdx=0, raf=0;
  function tick(){
    raf = requestAnimationFrame(tick);
    const now = performance.now();
    if (speaking) {
      const t = (now - startMs)/1000;
      tEl.textContent = t.toFixed(3);
      iEl.textContent = charIdx;
      LEl.textContent = txt.value.length;
      const pct = Math.min(100, (charIdx / Math.max(1, txt.value.length)) * 100);
      barEl.style.width = pct + '%';
      if (now - lastBoundaryMs > 160) morphToViseme("X", 100);
    }
  }

  speakBtn.onclick = () => {
    if (speaking) return;
    const utter = new SpeechSynthesisUtterance(txt.value);
    if (voices.length && voiceSel.value !== "") utter.voice = voices[+voiceSel.value];
    utter.rate = +rateEl.value;
    utter.pitch = +pitchEl.value;
    utter.volume = +volEl.value;

    speaking=true; startMs=performance.now(); lastBoundaryMs=startMs; charIdx=0;
    stopBtn.disabled=false;
    morphToViseme("G", 100);

    utter.onboundary = (e) => {
      if (!speaking) return;
      const idx = e.charIndex || 0;
      charIdx = idx;
      lastBoundaryMs = performance.now();
      const ch = txt.value[idx] || " ";
      morphToViseme(char2vis(ch), 100);
    };
    utter.onend = () => {
      speaking=false; stopBtn.disabled=true;
      morphToViseme("X", 120);
      barEl.style.width = "0%"; tEl.textContent = "0.000"; iEl.textContent = "0"; LEl.textContent = "0";
      cancelAnimationFrame(raf);
    };
    utter.onerror = () => {
      speaking=false; stopBtn.disabled=true; morphToViseme("X", 120);
      cancelAnimationFrame(raf);
    };

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
    cancelAnimationFrame(raf);
    tick();
  };

  stopBtn.onclick = () => {
    window.speechSynthesis.cancel();
    speaking=false; stopBtn.disabled=true; morphToViseme("X", 120);
    barEl.style.width = "0%"; tEl.textContent = "0.000"; iEl.textContent = "0"; LEl.textContent = "0";
    cancelAnimationFrame(raf);
  };
})();
</script>
</body>
</html>
